<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      .title {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 72px;
        font-weight: bold;
        fill: #E3242B; /* Rojo NAVRI */
        opacity: 0;
        animation: dropIn 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      .subtitle {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 24px;
        fill: #FFFFFF; /* Blanco */
        opacity: 0;
        animation: fadeIn 1.5s ease-out 0.8s forwards;
      }
      .decoration {
        fill: #E3242B;
        opacity: 0;
        animation: fadeIn 1s ease-out 1.5s forwards;
      }
      
      @keyframes dropIn {
        0% { transform: translateY(-30px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Fondo Negro (puedes cambiarlo a "transparent" si prefieres que se adapte al tema de GitHub) -->
  <rect width="100%" height="100%" fill="#000000" rx="15" />

  <!-- Texto Principal -->
  <text x="50%" y="45%" text-anchor="middle" dominant-baseline="middle" class="title">NAVRI</text>
  
  <!-- Subtítulo -->
  <text x="50%" y="70%" text-anchor="middle" dominant-baseline="middle" class="subtitle">Ideas que se convierten en proyectos.</text>

  <!-- Elementos decorativos pequeños -->
  <circle cx="280" cy="90" r="4" class="decoration" />
  <circle cx="520" cy="90" r="4" class="decoration" />
</svg>
